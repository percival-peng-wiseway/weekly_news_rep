<!DOCTYPE html>
<html>
  <body style="margin:0;padding:0;background:#ffffff;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:680px;margin:0 auto;padding:24px 16px 16px;">
      <tr>
        <td align="center" style="padding-bottom:16px;">
          <img src="$logo_url" alt="GCGF" width="160" style="display:block;height:auto;" />
        </td>
      </tr>
      <tr>
        <td>
          <h1 style="margin:0 0 8px 0;font-size:24px;line-height:1.2;color:#16a34a;border-bottom:2px solid #16a34a;padding-bottom:8px;">$email_title</h1>
        </td>
      </tr>
      <tr>
        <td style="padding-top:6px;padding-bottom:12px;font-size:13px;color:#64748b;">Last modified: $last_modified</td>
      </tr>
      <tr>
        <td style="padding-bottom:16px;font-size:14px;line-height:1.6;">Website: <a href="$website_url" style="color:#2563eb;text-decoration:underline;">$website_url</a></td>
      </tr>
      <tr>
        <td>
          $sections_html
        </td>
      </tr>
    </table>

</html>
