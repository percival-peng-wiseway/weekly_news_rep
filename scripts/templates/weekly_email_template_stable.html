<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>${email_subject}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body style="margin:0;padding:0;background:#f8fafc;color:#1f2937;font-family:Arial, Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif;line-height:1.6;">
    <div style="max-width:820px;margin:0 auto;padding:20px 16px 48px;">
      <div style="background:#fff;border-top:5px solid #16a34a;border-radius:16px;padding:24px 24px 16px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);">
        <a href="${website_url}" style="display:inline-block;margin-bottom:8px;">
          <img src="${logo_url}" alt="GCGF Logo" style="height:170px;display:block;margin:0 auto;" />
        </a>
        <h1 style="font-size:24px;line-height:1.3;color:#166534;margin:8px 0 6px;">${email_title}</h1>
        <div style="font-size:14px;color:#64748b;">Last modified: ${last_modified}</div>
      </div>

      <div style="margin:14px 0 22px;text-align:left;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;font-size:14px;">
        Website: <a href="${website_url}" style="color:#2563eb;text-decoration:underline;">${website_url}</a>
      </div>

      ${sections_html}
    </div>
  </body>
</html>
